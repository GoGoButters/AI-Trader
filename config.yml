# AI-Trader Orchestrator Configuration
# This is the central configuration file for all services and AI models

services:
  # Graphiti Memory Service (WORKING)
  graphiti: "url: http://192.168.1.107:8001; token: adapter-secret-api-key"
  
  # Perplexica News Search Service (deployed via docker-compose)
  perplexica: "url: http://perplexica-search:3000; api_key: dummy"
  
  # Reranker Service for improved search results
  reranker: "url: http://192.168.1.151:8080/rerank; api_key: dummy"
  
  # SearXNG News Search Service (local or external)
  searxng: "url: http://searxng:8080"

# AI Models Configuration (WORKING MODELS FROM GRAPHITI)
# Format: "model: [NAME]; api_base: [URL]; api_key: [KEY]"
models:
  # Primary model for fast analysis
  primary_analysis: "model: openrouter/xiaomi/mimo-v2-flash:free; api_base: http://192.168.1.107:4000/v1; api_key: sk-IRi6AuZjLJ50hmzvjoJgxw"
  
  # Deep reasoning model for complex decisions
  deep_reasoning: "model: openai/openai-reasoning; api_base: http://192.168.1.107:4000/v1; api_key: sk-jClmnTDRFFY1-dzQ98c08Q"
  
  # Embeddings model
  embeddings: "model: openai/text-embedding-qwen3-embedding-4b; api_base: http://192.168.1.107:4000/v1; api_key: sk-XE8pV1z4WTbJBpGQfI5nEg"
  
  # Fallback model (same as primary for now)
  fallback: "model: openrouter/xiaomi/mimo-v2-flash:free; api_base: http://192.168.1.107:4000/v1; api_key: sk-IRi6AuZjLJ50hmzvjoJgxw"

# Database Configuration
database:
  type: sqlite
  path: /app/data/orchestrator.db  # SQLite database path (mounted volume)
  # For PostgreSQL, uncomment and configure:
  # host: "localhost"
  # port: 5432
  # username: "orchestrator"
  # password: "your_password"
  # database: "ai_trader"

# Orchestrator Settings
orchestrator:
  # Network ports
  ui_port: 3000
  api_port: 8080
  
  # CORS configuration (comma-separated origins, * = allow all)
  cors_origins: "*"
  
  # Bot management
  max_concurrent_bots: 10
  default_bot_image: "freqtradeorg/freqtrade:stable"
  
  # Auto-restart on server reboot
  auto_restart_bots: true
  
  # News analysis settings
  enable_news_analysis: true
  news_check_interval_minutes: 15  # How often to check for new news
  news_hard_influence_enabled: false  # Enable force buy/sell on critical news
  
  # Paper trading defaults
  paper_trading_initial_balance: 1000.0
  paper_trading_slippage_min: 0.0005  # 0.05%
  paper_trading_slippage_max: 0.001   # 0.1%
  paper_trading_fee_rate: 0.001       # 0.1% taker fee

# Log settings
logging:
  level: DEBUG  # DEBUG, INFO, WARNING, ERROR
  file_rotation_mb: 10
  file_backup_count: 5
