version: '3.8'

services:
  # SearXNG - Meta Search Engine for News
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=ai-trader-secret-key-2026
    networks:
      - ai-trader-network
    restart: unless-stopped

  # Perplexica AI News Search (uses SearXNG as backend)
  perplexica:
    image: perplexica-local:latest
    container_name: perplexica-search
    ports:
      - "3000:3000"
    volumes:
      - ./orchestrator/perplexica-config:/app/config
      - perplexica_data:/app/data
    environment:
      # LLM Configuration (using models from Graphiti server)
      - OPENAI_API_BASE=http://192.168.1.107:4000/v1
      - OPENAI_API_KEY=sk-IRi6AuZjLJ50hmzvjoJgxw
      - CHAT_MODEL=openrouter/xiaomi/mimo-v2-flash:free
      - EMBEDDING_MODEL=openai/text-embedding-qwen3-embedding-4b
      - EMBEDDING_API_KEY=sk-XE8pV1z4WTbJBpGQfI5nEg
      # SearXNG backend configuration
      - SEARXNG_URL=http://searxng:8080
    depends_on:
      - searxng
    networks:
      - ai-trader-network
    restart: unless-stopped

  # Orchestrator Backend (FastAPI)
  orchestrator:
    build:
      context: ../
      dockerfile: orchestrator/backend/Dockerfile
    container_name: orchestrator-api
    ports:
      - "8080:8080"
    volumes:
      # Removed ./:/app to prevent overriding image contents
      - /var/run/docker.sock:/var/run/docker.sock # For Docker-in-Docker
      - ./data:/app/data # Only mount data directory
      - ./user_data:/app/user_data
      - ./backend:/app/backend # Mount code for development
    environment:
      - PYTHONUNBUFFERED=1
      - HOST_PROJECT_PATH=c:/Nextcloud/Work/experiments/ai/AI-Trader-develop/orchestrator
    depends_on:
      - perplexica
    networks:
      - ai-trader-network
    restart: unless-stopped

  # Frontend (Simple WebUI)
  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: orchestrator-ui
    ports:
      - "3001:80"
    depends_on:
      - orchestrator
    networks:
      - ai-trader-network
    restart: unless-stopped

volumes:
  perplexica_data:


networks:
  ai-trader-network:
    driver: bridge
