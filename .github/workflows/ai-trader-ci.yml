name: AI-Trader CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: "Python Linting"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff linter
        run: |
          ruff check orchestrator/backend --output-format=github || true

  docker-build:
    name: "Docker Build Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Orchestrator image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./orchestrator/backend/Dockerfile
          push: false
          tags: ai-trader-orchestrator:test
          load: true
